[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-retrieval"
version = "0.1.0"
description = "Воспроизводимый поиск кандидатов для объявлений услуг"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "scipy==1.13.1",
    "scikit-learn==1.8.0",
    "catboost==1.2.8",
    "nltk==3.9.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]
dense = ["torch==2.9.1", "transformers==5.6.2", "huggingface-hub==1.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
